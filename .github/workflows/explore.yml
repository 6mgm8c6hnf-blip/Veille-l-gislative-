name: explore
on:
  push:
    branches: [claude/project-thread-s0s7gz]
    paths: [.github/workflows/explore.yml]
jobs:
  an:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          set +e
          cd /tmp
          AN=https://data.assemblee-nationale.fr/static/openData/repository/17
          curl -sSL -o d.zip $AN/loi/dossiers_legislatifs/Dossiers_Legislatifs.json.zip; unzip -o -q d.zip -d dos
          f=$(grep -l 'curit' $(find dos -path '*dossierParlementaire*' -name '*.json') | grep -v xx | sort | tail -1); echo FILE $f; python3 -c "
          import json,sys
          d=json.load(open('$f'))
          s=json.dumps(d,ensure_ascii=False,indent=1)
          print(s[:9000])"
          echo "=== depotAmendements samples"; grep -h -o '"depotAmendements": *{[^}]*}[^}]*}' $(find dos -path '*document*' -name '*.json') | head -8
          echo "=== codeActe counts"; cat $(find dos -path '*dossierParlementaire*' -name '*.json') | grep -o '"codeActe": *"[^"]*"' | sort | uniq -c | sort -rn | head -60
          echo "=== QE"; curl -sSL -o qe.zip $AN/questions/questions_ecrites/Questions_ecrites.json.zip; unzip -o -q qe.zip -d qe; ls qe/json | wc -l; f=$(ls qe/json/* | sort -V | tail -1); python3 -c "
          import json; d=json.load(open('$f')); q=d['question']
          for k in ('textesReponse',): q.pop(k,None)
          print(json.dumps(d,ensure_ascii=False,indent=1)[:4000])"
          echo "=== QOSD"; curl -sSL -o qo.zip $AN/questions/questions_orales_sans_debat/Questions_orales_sans_debat.json.zip; unzip -o -q qo.zip -d qo; f=$(ls qo/json/* | sort -V | tail -1); python3 -m json.tool $f | head -80
          echo "=== AMENDEMENTS"; time curl -sSL -o am.zip $AN/loi/amendements_div_legis/Amendements.json.zip; unzip -l am.zip | head -8; unzip -l am.zip | tail -2
          f=$(unzip -Z1 am.zip | grep json$ | tail -1); unzip -p am.zip "$f" | python3 -m json.tool | head -150
          unzip -Z1 am.zip | awk -F/ '{print NF}' | sort | uniq -c
  senat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          set +e
          cd /tmp
          for u in https://data.senat.fr/data/dosleg/dossiers-legislatifs.csv https://data.senat.fr/dosleg/ https://data.senat.fr/la-base-questions/ https://data.senat.fr/ameli/ https://www.senat.fr/flux-rss.html https://agenda.senat.fr/ https://www.senat.fr/ordre-du-jour/ordre-du-jour.html; do
            echo "=== $u"; curl -sSL -o s.bin -w '%{http_code} %{size_download} %{content_type}\n' -m 60 "$u"
            if [[ "$u" == *.csv ]]; then iconv -f latin1 -t utf8 s.bin | head -5; wc -l s.bin; else
            grep -oE '(href|src)="[^"]+"' s.bin | sort -u | grep -viE 'connaitre|le-senat-et-vous|europe-et|lng/|assets/static|travailler|prix' | head -120; fi
          done
          echo "=== agenda.senat.fr body"; curl -sSL -m 60 https://agenda.senat.fr/ | head -c 6000

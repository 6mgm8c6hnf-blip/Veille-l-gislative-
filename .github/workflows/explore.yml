name: explore
on:
  push:
    branches: [claude/project-thread-s0s7gz]
    paths: [.github/workflows/explore.yml]
jobs:
  senat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          set +e
          cd /tmp
          echo "=== API paths in nuxt bundles"
          for js in $(curl -sSL https://agenda.senat.fr/ | grep -oE '/_nuxt/[A-Za-z0-9_-]+\.js' | sort -u); do curl -sSL "https://agenda.senat.fr$js" > b.js; grep -oE '.{120}apiUrl.{200}' b.js | head -5; grep -oE '"/[a-zA-Z_/-]*(agenda|event|evenement|reunion|seance|commission)[a-zA-Z_/{}-]*"' b.js | sort -u | head -20; grep -oE '`[^`]{0,80}(\$\{[^}]+\})[^`]{0,80}`' b.js | grep -iE 'api|agenda|date' | head -10; done
          for p in "" "/" "/jour/2026-11-25" "/2026-11-25" "?date=2026-11-25" "/events?date=2026-11-25" "/semaine/2026-11-23" "/evenements" "/organes" "/commissions"; do echo "=== API $p"; curl -sS -m 20 -w '  [%{http_code} %{content_type}]\n' "https://www.senat.fr/api/v1/agenda$p" | head -c 1500; echo; done
          echo "=== questions CSV"; for f in questions-depuis-un-an.csv qg.csv; do curl -sSL -o $f https://data.senat.fr/data/questions/$f; wc -l $f; iconv -f latin1 -t utf8 $f | head -4 | cut -c1-1500; file $f; done
          echo "=== dosleg police"; curl -sSL -o d.csv https://data.senat.fr/data/dosleg/dossiers-legislatifs.csv; iconv -f latin1 -t utf8 d.csv | grep -i 'Police et s' | grep -E '/20(25|26)"' | head -10; iconv -f latin1 -t utf8 d.csv | awk -F';' '{print $3}' | cut -c8-11 | sort | uniq -c | tail -4
          iconv -f latin1 -t utf8 d.csv | grep -E '"[0-9]{2}/[0-9]{2}/2026"' | head -3
          u=$(iconv -f latin1 -t utf8 d.csv | grep -i 'Police et s' | grep -E '"[0-9]{2}/[0-9]{2}/202[56]"' | head -1 | grep -oE 'https?://www.senat.fr/dossier-legislatif/[^"]+'); echo "DOSSIER $u"
          curl -sSL "$u" -o dl.html; grep -oE 'href="[^"]*(amendements|encommission|enseance|leg/|rap/)[^"]*"' dl.html | sort -u | head -40
          echo "=== jeu complet"; curl -sSL https://www.senat.fr/amendements/2013-2014/190/jeu_complet_2013-2014_190.csv | iconv -f latin1 -t utf8 | head -3 | cut -c1-800
          curl -sSL https://www.senat.fr/enseance/2017-2018/330/liste_discussion.json | head -c 1500; echo
          echo "=== AN URL checks"
          for u in https://www.assemblee-nationale.fr/dyn/17/reunions/RUANR5L17S2027IDC461754 https://www.assemblee-nationale.fr/dyn/reunions/RUANR5L17S2027IDC461754 https://www.assemblee-nationale.fr/dyn/17/amendements/AMANR5L17PO838901BTC2200P0D1N000043 https://www.assemblee-nationale.fr/dyn/17/amendements/2200/AN/43 https://www.assemblee-nationale.fr/dyn/17/questions/QANR5L17QE19795 https://questions.assemblee-nationale.fr/q17/17-19795QE.htm https://www.assemblee-nationale.fr/dyn/17/dossiers/RIN_DDF_LFSS_2027 https://www.assemblee-nationale.fr/dyn/17/dossiers/DLR5L17N55123 https://www.assemblee-nationale.fr/dyn/17/organes/commissions-permanentes/lois/agenda https://www.assemblee-nationale.fr/dyn/agenda; do echo "$(curl -sS -o /dev/null -m 20 -w '%{http_code} %{url_effective}' -L -A 'Mozilla/5.0' $u)  <- $u"; done
